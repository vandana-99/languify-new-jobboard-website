name: Update job listings

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4,16 * * *'

permissions:
  contents: read

concurrency:
  group: employer-job-collection
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-jobs.txt

      - name: Install platform collector
        id: platform-dependencies
        continue-on-error: true
        run: python -m pip install -r requirements-jobs.txt

      - name: Test feed handling
        run: npm test

      - name: Test collection failure handling
        run: python -m unittest discover -s tests -p '*_test.py'

      - name: Collect LinkedIn and Naukri
        if: steps.platform-dependencies.outcome == 'success'
        continue-on-error: true
        run: python scripts/collect-job-boards.py

      - name: Collect employer feeds and merge job sources
        run: npm run collect

      - name: Validate snapshot
        run: npm run check:feed

      - name: Commit snapshot to this repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh job listings'
            git push
          fi

      - name: Request the separate Cloudflare Pages deployment
        env:
          CLOUDFLARE_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: node scripts/request-deploy.mjs

      - name: Check source health after requesting publication
        run: node --experimental-strip-types scripts/check-feed.mjs --require-success --require-platforms
